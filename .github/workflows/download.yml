name: Download PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download PDF
        run: |
          curl -L -o "LLM.pdf" "https://arxiv.org/pdf/2308.01862"

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Add FEC Survey PDF"
          git push
