name: Download PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download PDF
        run: |
          curl -L -o "FEC_Survey.pdf" "https://www.researchgate.net/profile/Ioannis-Tomkos/publication/266388691_A_Survey_on_FEC_Codes_for_100_G_and_beyond_Optical_Networks/links/542fcbcb0cf29bbc12727d61/A-Survey-on-FEC-Codes-for-100-G-and-beyond-Optical-Networks.pdf?_tp=eyJjb250ZXh0Ijp7ImZpcnN0UGFnZSI6InB1YmxpY2F0aW9uIiwicGFnZSI6InB1YmxpY2F0aW9uIn19"

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add FEC_Survey.pdf
          git commit -m "Add FEC Survey PDF"
          git push
