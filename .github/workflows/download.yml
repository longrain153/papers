name: Download PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download PDF
        run: |
          curl -L -o "FEC_Survey.pdf" "https://www.researchgate.net/profile/Dimitrios-Soudris/publication/221457664_Configurable_baseband_digital_transceiver_for_Gbps_wireless_60_GHz_communications/links/5720adc108aead26e7200a0b/Configurable-baseband-digital-transceiver-for-Gbps-wireless-60-GHz-communications.pdf"

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add FEC_Survey.pdf
          git commit -m "Add FEC Survey PDF"
          git push
