name: Download PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download PDF
        run: |
          curl -L -o "FEC_Survey.pdf" "https://www.researchgate.net/publication/266388691_A_Survey_on_FEC_Codes_for_100_G_and_beyond_Optical_Networks/link/542fcbcb0cf29bbc12727d61/download?_tp=eyJjb250ZXh0Ijp7ImZpcnN0UGFnZSI6InB1YmxpY2F0aW9uIiwicGFnZSI6InB1YmxpY2F0aW9uIn19"

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add FEC_Survey.pdf
          git commit -m "Add FEC Survey PDF"
          git push
